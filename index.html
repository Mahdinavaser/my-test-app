<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f6f6f6;
      /* ensure content isn't hidden under bottom nav */
      padding-bottom: 72px;
    }
    header {
      background: #007bff;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
    }
    .screen {
      display: none;
      padding: 15px;
    }
    .active {
      display: block;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: #fff;
      border-top: 1px solid #ddd;
      height: 56px;
      align-items: center;
    }
    .bottom-nav button {
      flex: 1;
      border: none;
      background: none;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .bottom-nav button.active {
      color: #007bff;
      font-weight: bold;
    }
    .chapter {
      background: white;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-box {
      border: 1px solid #ccc;
      background: white;
      height: 350px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
    .chat-input {
      display: flex;
      gap: 6px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .chat-input button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header id="title">Home</header>

  <!-- Home Screen -->
  <div id="home" class="screen active" aria-live="polite">
    <h2>Book Chapters</h2>
    <div class="chapter" onclick="showChapter(1)" role="button" tabindex="0">
      <strong>Chapter 1: The Beginning</strong><br>
      <small>Hello, my name</small>
    </div>
    <div class="chapter" onclick="showChapter(2)" role="button" tabindex="0">
      <strong>Chapter 2: The Journey</strong><br>
      <small>Is</small>
    </div>
    <div class="chapter" onclick="showChapter(3)" role="button" tabindex="0">
      <strong>Chapter 3: The End</strong><br>
      <small>Mehdi navaser</small>
    </div>

    <div id="chapterContent" style="display:none; margin-top:20px; background:white; padding:15px; border-radius:8px;"></div>
  </div>

  <!-- Announcements Screen -->
  <div id="announcements" class="screen">
    <h2>Announcements</h2>
    <p>No announcements yet.</p>
  </div>

  <!-- Chatroom Screen -->
  <div id="chatroom" class="screen">
    <h2>Welcome to Chemistry Science Chatroom</h2>
    <div id="usernameContainer" style="text-align:center;">
      <p>Please enter your username to start chatting:</p>
      <label for="usernameInput" style="display:none">username</label>
      <input type="text" id="usernameInput" placeholder="Enter username..." style="padding:8px; width:80%;" aria-label="username">
      <br><br>
      <button id="continueBtn" style="padding:8px 16px;">Continue</button>
    </div>

    <div id="chatContainer" style="display:none;">
      <div class="chat-box" id="messages" aria-live="polite" aria-atomic="false"></div>
      <div class="chat-input">
        <label for="msgInput" style="display:none">Message</label>
        <input id="msgInput" type="text" placeholder="Type your message..." aria-label="message input" />
        <button id="sendBtn" aria-label="send message">Send</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button class="active" onclick="switchScreen('home', this)">🏠 Home</button>
    <button onclick="switchScreen('announcements', this)">📢 Announcements</button>
    <button onclick="switchScreen('chatroom', this)">💬 Chatroom</button>
  </div>

  <!-- Firebase modular SDK (ES module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";

    // Your firebase config (frontend keys are public — secure rules are important)
    const firebaseConfig = {
      apiKey: "AIzaSyDoZzAt-G7OMDA_A_WQC7udTtKCPRUCoTw",
      authDomain: "classchat2025-a2d96.firebaseapp.com",
      databaseURL: "https://classchat2025-a2d96-default-rtdb.firebaseio.com",
      projectId: "classchat2025-a2d96",
      storageBucket: "classchat2025-a2d96.firebasestorage.app",
      messagingSenderId: "673495831165",
      appId: "1:673495831165:web:bebb70d1c51a3f21d31714"
    };

    // Initialize firebase (modular)
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, "chat");

    // Helper: safe text node append (avoids innerHTML/XSS)
    function appendMessageToBox(msg) {
      const messages = document.getElementById("messages");
      const p = document.createElement("p");

      const strong = document.createElement("strong");
      strong.textContent = msg.name || "Unknown";
      p.appendChild(strong);

      p.appendChild(document.createTextNode(": " + (msg.text || "") ));

      const br = document.createElement("br");
      p.appendChild(br);

      const small = document.createElement("small");
      const time = msg.time ? new Date(msg.time) : new Date();
      small.textContent = time.toLocaleTimeString();
      p.appendChild(small);

      messages.appendChild(p);
      messages.scrollTop = messages.scrollHeight;
    }

    // Navigation
    function switchScreen(screen, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(screen);
      if (!target) return;
      target.classList.add('active');

      document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      // Title formatting
      document.getElementById("title").innerText = screen.charAt(0).toUpperCase() + screen.slice(1);
    }
    // expose to global so inline onclick works
    window.switchScreen = switchScreen;

    // Chapters
    function showChapter(num) {
      const content = {
        1: "Chapter 1: Hello, my name",
        2: "Chapter 2: Is",
        3: "Chapter 3: Mehdi navaser"
      };
      const raw = content[num];
      if (!raw) return;
      const parts = raw.split(':');
      const heading = parts[0] || "";
      const text = parts.slice(1).join(':') || "";
      const div = document.getElementById("chapterContent");
      // use textContent for safety
      div.innerHTML = "";
      const h = document.createElement("h3");
      h.textContent = heading;
      const p = document.createElement("p");
      p.textContent = text.trim();
      div.appendChild(h);
      div.appendChild(p);
      div.style.display = "block";
      // switch to home so visible (optional)
      switchScreen('home', document.querySelector('.bottom-nav button.active'));
    }
    window.showChapter = showChapter;

    // Chat functionality
    let username = localStorage.getItem('chatUsername') || "";

    const usernameInput = document.getElementById("usernameInput");
    const usernameContainer = document.getElementById("usernameContainer");
    const chatContainer = document.getElementById("chatContainer");
    const continueBtn = document.getElementById("continueBtn");

    function setUsername() {
      const val = usernameInput.value.trim();
      if (!val) {
        alert("Please enter a username!");
        return;
      }
      username = val;
      localStorage.setItem('chatUsername', username);
      usernameContainer.style.display = "none";
      chatContainer.style.display = "block";
    }
    continueBtn.addEventListener('click', setUsername);

    // If we already had a username stored, auto-show chat
    if (username) {
      usernameInput.value = username;
      usernameContainer.style.display = "none";
      chatContainer.style.display = "block";
    }

    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      if (!username) {
        alert("Please enter a username first.");
        return;
      }
      const msg = { name: username, text, time: Date.now() };
      push(chatRef, msg).catch(err => {
        console.error("Failed to send:", err);
        alert("Failed to send message. Check console.");
      });
      msgInput.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    // Enter key to send
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    // Listen for new messages (child_added -> safe append)
    onChildAdded(chatRef, (snapshot) => {
      const msg = snapshot.val();
      appendMessageToBox(msg);
    });

    // Expose small helpers for debugging (optional)
    window.sendMessage = sendMessage;
  </script>
</body>
</html>
